name: Code integration source checks

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  source-contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Identify the runner's test runtime
        run: node --version
      - name: Check syntax
        run: npm run check
      - name: Check editor and IPC contracts
        run: npm test
      - name: Check offline source-build contract
        run: python3 -B -m unittest discover -s tests -p 'test_build_codex_runtime.py'
      - name: Check OpenCode source-build and namespace contracts
        run: python3 -B -m unittest discover -s tests -p 'test_*opencode*.py'
      - name: Check explicit output-constraint session selection
        run: python3 -B -m unittest discover -s tests -p test_output_constraint_session.py

# No dependency installation, runtime/model download, real inference, editor
# installation or privileged service startup. These are source/protocol checks.
